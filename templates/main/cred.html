<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authandication Page</title>
    <style>
        .alert {
            padding: 20px;
            background-color: #f44336;
            color: white;
            opacity: 1;
            transition: opacity 0.6s;
            margin-bottom: 15px;
        }

        .alert.success {
            background-color: #04AA6D;
        }

        .alert.info {
            background-color: #2196F3;
        }

        .alert.warning {
            background-color: #ff9800;
        }

        .closebtn {
            margin-left: 15px;
            color: white;
            font-weight: bold;
            float: right;
            font-size: 22px;
            line-height: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .closebtn:hover {
            color: black;
        }

        .credentials {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            

        }

        .loginBox,
        .signupBox {
            width: 50%;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .credHead {
            text-align: center;
            margin-bottom: 20px;
        }

        .credentials input[type=text],
        .credentials input[type=password],
        .credentials select {
            width: 100%;
            height: 3vh;
            padding: 1%;
        }

        .credentials select {
            height: 5vh;
            margin-top: 2%;
        }

        .credbtn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .swipbtn {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #007bff;
            cursor: pointer;
        }
    </style>
</head>

<body>
    {% for message in messages %}
    <div class="alert {{message.tags}}">
        <span class="closebtn" onclick="this.parentElement.style.display='none';">&times;</span>
        <strong>Message: </strong> {{message}}
    </div>
    {% endfor %}
    <div class="credentials">

        <div class="loginBox" id="login">
            <form class="credform" action="/blog/login/" method="post">
                {% csrf_token %}
                <h2 class="credHead">Login</h2>
                <div class="password-toggle">
                    {{ login.as_p }}
                </div>
                <input type="submit" class="credbtn" name="login" id="loginbtn" value="Login">
                <span class="swipbtn" onclick="displaySignup()">New User Registration</span>
            </form>
        </div>

        <div class="signupBox" id="signup" style="display: none;">
            <form method="post" action="/blog/signup/">
                {% csrf_token %}
                <h2 class="credHead">Signup</h2>
                <div class="password-toggle">
                    {{ signup.as_p }}
                </div>
                <input type="submit" class="credbtn" name="signup" id="signupbtn" value="Signup">
                <span class="swipbtn" onclick="displayLogin()">Go Back To Login</span>
            </form>
        </div>

    </div>

    <script>
        var loginform = document.getElementById('login')
        var signupform = document.getElementById('signup')

        function displaySignup() {
            loginform.style.display = 'none';
            signupform.style.display = 'block'
        }

        function displayLogin() {
            loginform.style.display = 'block';
            signupform.style.display = 'none'
        }

        function validateForm() {
            var password1 = document.getElementById('Signpass1').value;
            var password2 = document.getElementById('Signpass2').value;
            if (password1 !== password2) {
                alert('Passwords do not match');
                return false;
            }
            return true;
        }

        document.querySelectorAll('input[type="password"]').forEach(function (input) {
            // Create a button to toggle password visibility
            const toggleButton = document.createElement('button');
            toggleButton.textContent = 'Show';
            toggleButton.addEventListener('click', function () {
                if (input.type === 'password') {
                    input.type = 'text';
                    toggleButton.textContent = 'Hide';
                } else {
                    input.type = 'password';
                    toggleButton.textContent = 'Show';
                }
            });

            // Insert the button after the password input field
            input.insertAdjacentElement('afterend', toggleButton);
        });


    </script>
</body>

</html>
